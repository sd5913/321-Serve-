<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fa2e45"><title>321 Serve!</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="level-select.css"></head>
<body><main><section class="game" aria-label="321 Serve rhythm game">
<canvas id="canvas" inert width="1200" height="675" aria-label="Tap when a rice plate reaches the red target"></canvas>
<div class="topline" id="gameInfo" hidden><span id="phase">RICE RICE BABY</span><span id="score">000000</span></div>
<div class="progress" id="progressTrack" hidden><i id="progress"></i></div>
<button id="pause" class="pause-button image-button" aria-label="Pause game" hidden disabled><img src="assets/ui/elements/buttons/pause.svg" alt=""></button>
<div id="beatHud" class="beat-hud" role="group" aria-label="Upcoming inputs" hidden><div class="hud-track"></div></div>
<button id="skipTutorial" class="tutorial-skip" aria-label="Skip tutorial and start the level" hidden>SKIP TUTORIAL</button>
<div id="judgmentLayer" class="judgment-layer" aria-hidden="true" hidden><img id="judgmentArt" alt=""><span id="judgmentText"></span><span id="judgmentDetail"></span></div>
<div id="overlay" class="screen home-screen"><div class="start-screen"><canvas id="startMotion" class="start-art" aria-hidden="true"></canvas><h1 class="start-title"><img src="assets/ui/elements/branding/logo-321-serve.svg" alt="321 Serve!"></h1><button id="start" class="image-button" aria-label="Select level" disabled><img src="assets/ui/elements/buttons/unified/select-level.svg" alt="SELECT LEVEL"></button><button id="startSettings" class="image-button" aria-label="Settings" aria-controls="settings" aria-expanded="false"><img src="assets/ui/elements/buttons/unified/settings-gear.svg" alt=""></button></div></div>
<section id="levelSelect" class="screen level-select-screen" aria-label="Select a level" hidden>
<img class="level-select-logo" src="assets/ui/elements/branding/logo-321-serve.svg" alt="321 Serve!">
<h2 class="level-select-title"><img id="selectedLevelTitle" src="assets/ui/level-select/title-1.svg" alt="Rice Rice Baby"></h2>
<button id="levelSettings" class="image-button level-select-settings" aria-label="Settings" aria-controls="settings"><img src="assets/ui/elements/buttons/unified/settings-gear.svg" alt=""></button>
<div id="levelCarousel" class="level-carousel" role="group" aria-roledescription="carousel" aria-label="Choose a level">
<div class="level-cards">
<button class="level-card" aria-label="Select Rice Rice Baby" aria-pressed="true"><img src="assets/ui/level-select/level-1.svg" alt="Level 1" draggable="false"></button>
<button class="level-card" aria-label="Select Catch Me If You Can" aria-pressed="false"><img src="assets/ui/level-select/level-2.svg" alt="Level 2" draggable="false"></button>
<button class="level-card" aria-label="Select Sashimi, Baby!" aria-pressed="false"><img src="assets/ui/level-select/level-3.svg" alt="Level 3" draggable="false"></button>
<button class="level-card" aria-label="Select Grill Me Maybe" aria-pressed="false"><img src="assets/ui/level-select/level-4.svg" alt="Level 4" draggable="false"></button>
</div>
<div class="level-highlight level-highlight-left" aria-hidden="true"><i></i><i></i><i></i></div><div class="level-highlight level-highlight-right" aria-hidden="true"><i></i><i></i><i></i></div>
<button id="previousLevel" class="level-arrow previous-level" aria-label="Previous level" disabled><svg viewBox="0 0 60 60" aria-hidden="true"><path d="M35 17 22 30l13 13"/></svg></button>
<button id="nextLevel" class="level-arrow next-level" aria-label="Next level"><svg viewBox="0 0 60 60" aria-hidden="true"><path d="m25 17 13 13-13 13"/></svg></button>
</div>
<div class="level-pagination" role="group" aria-label="Level shortcuts"><button data-level-dot="1" aria-label="Select Rice Rice Baby" aria-pressed="true"></button><button data-level-dot="2" aria-label="Select Catch Me If You Can" aria-pressed="false"></button><button data-level-dot="3" aria-label="Select Sashimi, Baby!" aria-pressed="false"></button><button data-level-dot="4" aria-label="Select Grill Me Maybe" aria-pressed="false"></button></div>
<button id="playLevel" class="image-button level-play" aria-label="Start Rice Rice Baby"><img src="assets/ui/elements/buttons/unified/start.svg" alt="START"></button>
<button id="levelBack" class="image-button level-back" aria-label="Back to home"><img src="assets/ui/elements/buttons/unified/back.svg" alt="BACK"></button>
<p class="level-swipe-hint"><span aria-hidden="true">←</span> SWIPE TO SELECT <span aria-hidden="true">→</span></p>
</section>
<section id="emptyLevel" class="screen empty-level-screen" aria-label="Empty level" hidden><button id="emptyBack" class="image-button empty-back" aria-label="Back to level selection"><img src="assets/ui/elements/buttons/unified/back.svg" alt="BACK"></button></section>
<section id="tutorial" class="screen tutorial-screen" aria-label="Rice Rice Baby tutorial" hidden>
<div class="tutorial-color-blocks" aria-hidden="true"><i class="block-left"></i><i class="block-right"></i><i class="block-bottom"></i><i class="block-top"></i></div>
<img id="tutorialCard" class="lesson-card" src="assets/ui/elements/tutorial/rice-rice-baby/intro-card.svg" alt="">
<img id="tutorialTurn" class="lesson-turn" src="assets/ui/elements/tutorial/rice-rice-baby/now-its-your-turn.svg" alt="Now it’s your turn!" hidden>
<p id="tutorialRetry" class="lesson-retry" hidden>TRY AGAIN — FOLLOW THE SOUND CUES</p>
<button id="tutorialContinue" class="image-button lesson-continue" aria-label="Continue"><img src="assets/ui/elements/tutorial/rice-rice-baby/continue-button.svg" alt="CONTINUE"></button>
<img id="tutorialCount" class="lesson-count" alt="" hidden>
</section>
<div id="modal" class="modal-layer" hidden><section class="art-panel pause-panel" role="dialog" aria-modal="true" aria-label="Paused"><img class="panel-title" src="assets/ui/elements/titles/paused.svg" alt="PAUSED"><button id="resume" class="image-button"><img src="assets/ui/elements/buttons/unified/resume.svg" alt="RESUME"></button><button id="retry" class="image-button"><img src="assets/ui/elements/buttons/unified/restart.svg" alt="RESTART"></button><button id="pauseHome" class="image-button"><img src="assets/ui/elements/buttons/unified/home-pause.svg" alt="HOME"></button><button id="settingsToggle" class="small-link" aria-controls="settings" aria-expanded="false">SETTINGS</button></section></div>
<div id="settings" class="modal-layer settings-layer" hidden><section class="art-panel settings-panel" role="dialog" aria-modal="true" aria-label="Settings"><img class="panel-title" src="assets/ui/elements/titles/settings.svg" alt="SETTINGS"><label class="volume-row"><img src="assets/ui/elements/settings/label-music.svg" alt="MUSIC"><input id="musicVolume" aria-label="Music volume" type="range" min="0" max="100" value="100"></label><label class="volume-row"><img src="assets/ui/elements/settings/label-sfx.svg" alt="SFX"><input id="sfxVolume" aria-label="Sound effect volume" type="range" min="0" max="100" value="100"></label><label class="offset-row">INPUT OFFSET <output id="offsetLabel">0 ms</output><input id="offset" aria-label="Input timing compensation" type="range" min="-200" max="200" step="10" value="0"></label><label class="motion-row"><input id="motion" type="checkbox"> REDUCED MOTION</label><button id="settingsBack" class="image-button"><img src="assets/ui/elements/buttons/unified/back.svg" alt="BACK"></button></section></div>
<div id="quitDialog" class="modal-layer quit-layer" hidden><section class="art-panel quit-panel" role="dialog" aria-modal="true" aria-label="Quit game?"><img class="panel-title" src="assets/ui/elements/titles/quit-game.svg" alt="QUIT GAME?"><img class="quit-message" src="assets/ui/elements/labels/progress-will-be-lost.svg" alt="Your progress will be lost."><button id="cancelQuit" class="image-button"><img src="assets/ui/elements/buttons/unified/cancel.svg" alt="CANCEL"></button><button id="confirmQuit" class="image-button"><img src="assets/ui/elements/buttons/unified/quit.svg" alt="QUIT"></button></section></div>
<div id="results" class="screen results-screen" hidden><img class="result-logo" src="assets/ui/elements/branding/logo-321-serve.svg" alt="321 Serve!"><div class="result-dish" aria-hidden="true"><img class="dish-plate" src="assets/game/environment/plate.png" alt=""><img class="dish-rice" src="assets/game/rice/formed.png" alt=""></div><div class="result-content"><img class="result-title" src="assets/ui/elements/titles/nice-cuts.svg" alt="NICE CUTS!"><img id="accuracy" class="accuracy" src="assets/ui/elements/result/percentages/000.svg" alt="0%" aria-label="0 percent accuracy"><img class="result-celebration celebration-left" src="assets/ui/elements/decorations/celebration-left.svg" alt=""><img class="result-celebration celebration-right" src="assets/ui/elements/decorations/celebration-right.svg" alt=""><img class="result-tag" src="assets/ui/elements/result/label-on-beat.svg" alt="ON BEAT"><p id="resultStats" class="result-stats"></p><button id="resultRetry" class="image-button"><img src="assets/ui/elements/buttons/unified/retry.svg" alt="RETRY"></button><button id="resultHome" class="image-button"><img src="assets/ui/elements/buttons/unified/home-result.svg" alt="HOME"></button></div></div>
</section><footer><button id="audioStudioToggle" aria-controls="audioStudio" aria-expanded="false">AUDIO STUDIO</button><span id="status" role="status" aria-live="polite">Listen first. Tap on the beat.</span><div class="utility"><button id="sound" aria-pressed="false">SOUND ON</button><button id="full" aria-label="Toggle fullscreen">FULLSCREEN</button></div></footer><section id="audioStudio" class="audio-studio" aria-label="Audio studio" hidden></section></main>
<audio id="menuMusic" src="assets/audio/menu/rolling-rhythm.mp3?v=rolling-rhythm-3" autoplay loop preload="auto" hidden></audio><audio id="music" src="assets/audio/rice-rice-baby.mp3" preload="auto"></audio><script src="startpage-motion.js"></script><script src="ui-state.js"></script><script src="rice-audio.js"></script><script src="soundtrack.js"></script><script src="audio-studio.js"></script><script src="ui-audio.js"></script><script src="game.js?v=rice-clean-hud-1"></script><script src="tutorial-flow.js?v=rice-machine-ui-2"></script><script src="level-select.js?v=level3-entry-1"></script>
<script src="menu-music.js?v=rolling-rhythm-1"></script>
</body></html>
