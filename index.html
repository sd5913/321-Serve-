<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>321! Serve — 饭团节拍</title><link rel="stylesheet" href="style.css"></head><body><main><header><a class="logo" href="./index.html">321!<span>SERVE</span><i>✦</i></a><div class="chapter"><span>THE RHYTHM KITCHEN</span><b>01 / 饭团节拍</b></div><div class="tools"><button id="sound" aria-label="切换声音">声音 ON</button><button id="pause" aria-label="暂停游戏" disabled>Ⅱ</button><button id="full" aria-label="全屏">⛶</button></div></header><section class="game" aria-label="饭团节奏游戏"><canvas id="canvas" inert width="1200" height="675" aria-label="饭团到达中央红色区域时按空格，黄色特写中跟随圆点按拍"></canvas><div class="topline"><span id="phase">LEVEL 01 · RICE RICE BABY</span><span id="score">000000</span></div><div class="progress"><i id="progress"></i></div><div id="overlay">
  <div class="start-screen">
    <div class="start-art" aria-hidden="true"></div>
    <h1 class="start-title"><img src="assets/ui/elements/branding/logo-321-serve.png" alt="321 Serve!"></h1>
    <button id="start" type="button" aria-label="开始游戏" disabled>
      <img src="assets/ui/elements/buttons/start.png" alt="">
    </button>
    <button id="startSettings" type="button" aria-label="节拍设置" aria-controls="settings" aria-expanded="false">
      <img src="assets/ui/elements/buttons/settings-gear.png" alt="">
    </button>
  </div>
</div><div id="modal" hidden><div class="panel"><span class="eyebrow" id="modalLabel">TAKE A BREATHER</span><h2 id="modalTitle">休息一拍</h2><p id="modalBody"></p><button class="primary" id="resume">继续开饭</button><button id="retry">重新开始</button></div></div></section><footer><div><span class="key">SPACE</span><span>按拍捏饭团</span><span class="divider"></span><span class="key">ESC</span><span>暂停</span></div><p id="status" role="status" aria-live="polite">先听四拍，再开始。每一拍都有好胃口。</p><button id="settingsToggle" aria-controls="settings" aria-expanded="false">节拍设置 ↗</button></footer><section class="settings" id="settings" hidden><label>输入补偿 <input id="offset" type="range" min="-200" max="200" step="10" value="0"><output id="offsetLabel">0 ms</output></label><label><input id="motion" type="checkbox"> 减少震动与特写</label><span>正值：补偿较晚的按键。更改后重新开局试听。</span></section><div class="colophon"><span>HANDMADE BITES / PERFECTLY OFFBEAT</span><span>捏一下，快乐加一。</span></div></main><script src="game.js"></script></body></html>
